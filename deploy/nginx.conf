# Reference nginx config for the D2R Randomizer Hostinger deployment.
# Install on the VPS (e.g. /etc/nginx/sites-available/d2rrandomizer and symlink
# into /etc/nginx/sites-enabled/), then `nginx -t && systemctl reload nginx`.
#
# Assumes the Next.js process listens on 127.0.0.1:3000 (via PM2 / ecosystem.config.js).
# Terminates TLS here — adjust certificate paths for your cert provider.

# Cache zone for static-like routes (homepage, /generate, etc). ~100MB on disk.
proxy_cache_path /var/cache/nginx/d2rr levels=1:2 keys_zone=d2rr_cache:10m max_size=100m inactive=1h use_temp_path=off;

upstream d2rr_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name d2rrandomizer.com www.d2rrandomizer.com;

    # Redirect all http → https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name d2rrandomizer.com www.d2rrandomizer.com;

    # TLS — replace with actual cert paths
    ssl_certificate     /etc/letsencrypt/live/d2rrandomizer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d2rrandomizer.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Compression — Node doesn't gzip responses, so we do it here.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # Sane limits
    client_max_body_size 1m;
    proxy_read_timeout 90s;         # Exceeds /api/randomize maxDuration (60s)
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;

    # Pass real client IP through to Node so our rate limiter sees it.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # /_next/static/* — immutable, safe to cache hard at the edge.
    location /_next/static/ {
        proxy_cache d2rr_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        proxy_pass http://d2rr_upstream;
    }

    # /mutations/*.png|.webp, /favicon.svg — static assets.
    location /mutations/ {
        proxy_cache d2rr_cache;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public" always;
        proxy_pass http://d2rr_upstream;
    }

    # /api/* — never cache, but still use the upstream with keepalive.
    location /api/ {
        proxy_pass http://d2rr_upstream;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # Everything else — app pages. Short edge cache so the homepage survives a
    # traffic spike even if the Node revalidate window hasn't ticked.
    location / {
        proxy_cache d2rr_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_bypass $cookie_nocache;
        proxy_pass http://d2rr_upstream;
    }
}
